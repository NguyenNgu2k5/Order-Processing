services:
  postgres:
    image: postgres:17
    container_name: order-processing-postgres

    environment:
      POSTGRES_DB: order_processing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - order_processing_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_processing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  order_processing_postgres_data: